<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="iconGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <!-- Subtle border -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Glowing icon container -->
  <rect x="96" y="96" width="320" height="320" rx="80" fill="url(#iconGrad512)" filter="url(#glow512)"/>
  
  <!-- Rupee Symbol -->
  <text x="256" y="306" font-family="Arial, 'Segoe UI', sans-serif" font-weight="900" font-size="200" fill="#ffffff" text-anchor="middle" dominant-baseline="central">₹</text>
</svg>
